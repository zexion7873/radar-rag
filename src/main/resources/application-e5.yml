# M4 arm: intfloat/multilingual-e5-small (384-d, mean pooling, trained at 512 tokens).
# Files come from scripts/fetch-models.sh; E5PrefixEmbeddingModel adds the "query: " / "passage: "
# markers the model was trained with.
spring:
  ai:
    embedding:
      transformer:
        onnx:
          model-uri: file:models/e5/model.onnx
        tokenizer:
          uri: file:models/e5/tokenizer.json
          options:
            "[padding]": "true"
            "[truncation]": "true"
            "[maxLength]": "512"
        # file: URIs need no download cache.
        cache:
          enabled: false
    vectorstore:
      pgvector:
        # Each arm embeds into its own table, so switching arms never mixes vector spaces.
        table-name: vector_store_e5

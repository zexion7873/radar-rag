# M4 arm: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 (384-d, mean pooling).
# Files come from scripts/fetch-models.sh. maxLength 128 is the model's own max_seq_length, the
# length sentence-transformers runs it at.
spring:
  ai:
    embedding:
      transformer:
        onnx:
          model-uri: file:models/paraphrase/model.onnx
        tokenizer:
          uri: file:models/paraphrase/tokenizer.json
          options:
            "[padding]": "true"
            "[truncation]": "true"
            "[maxLength]": "128"
        # file: URIs need no download cache.
        cache:
          enabled: false
    vectorstore:
      pgvector:
        # Each arm embeds into its own table, so switching arms never mixes vector spaces.
        table-name: vector_store_paraphrase

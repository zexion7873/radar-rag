spring:
  application:
    name: radar-rag
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/radar}
    username: ${POSTGRES_USER:radar}
    password: ${POSTGRES_PASSWORD:radar}
  ai:
    # Local in-process ONNX embeddings: paraphrase-multilingual-MiniLM-L12-v2 (384-d, mean pooling),
    # the M4 A/B winner. scripts/fetch-models.sh puts it in models/ at a pinned Hugging Face revision,
    # sha256-checked; the eval gate reads any rank change under a moving model as a regression.
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: file:models/paraphrase/model.onnx
        tokenizer:
          uri: file:models/paraphrase/tokenizer.json
          options:
            "[padding]": "true"
            "[truncation]": "true"
            # The model's own max_seq_length; 1 of the 190 fixture rows is longer.
            "[maxLength]": "128"
        # file: URIs need no download cache.
        cache:
          enabled: false
    # P2: Claude generates the grounded /ask answers. Empty key still boots (only /ask calls fail),
    # so /sync and /search stay usable without an Anthropic key.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          # Opus 5.5 always thinks and rejects sampling parameters; AnthropicConfig builds the
          # chat model from model + max-tokens only. Thinking tokens count against max-tokens.
          model: ${ANTHROPIC_MODEL:claude-opus-5-5}
          max-tokens: 16000
    # The 1.0.0 default (10 attempts, 2s x5 backoff capped at 3 min) holds one /ask for ~20 min on
    # a 529. 429 is listed so a rate limit is retried and surfaces as 503, like an overload.
    retry:
      max-attempts: 2
      on-http-codes: 429
    vectorstore:
      pgvector:
        dimensions: 384
        # Exact search: HNSW filters after its approximate scan, so a week-filtered /search could
        # return < topK rows. An existing HNSW table needs the one-time drop in the README.
        index-type: NONE
        distance-type: COSINE_DISTANCE
        initialize-schema: true            # creates the vector_store table on first run

radar:
  notion:
    token: ${NOTION_TOKEN}
    # Overridable so tests and the eval harness can point the service at a local Notion stub.
    base-url: ${NOTION_BASE_URL:https://api.notion.com/v1}
    version: "2025-09-03"                   # the API version that introduced data sources
    # Trending Archive data source (same id as github-radar-ui/lib/config.ts).
    trending-data-source: ${TRENDING_DATA_SOURCE:f67aaa24-d5f2-415c-9358-c7d9d2f9713e}

server:
  # Loopback by default: /ask spends Anthropic credit and none of the endpoints authenticate, so a
  # dev run must not be reachable from the LAN. A container sets SERVER_ADDRESS=0.0.0.0 (M9/M10).
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    # Internal service: surface the validation reason (e.g. "q is required") in the JSON body,
    # matching ApiErrorHandler's expose-the-cause stance. Don't enable on a public-facing app.
    include-message: always

logging:
  level:
    com.radar.intel: DEBUG

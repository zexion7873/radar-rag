name: Weekly sync

# Re-embeds the Trending Archive and the blog on the deployed service. The Trending routine writes
# its rows on Mondays at 01:00 UTC; this runs two hours later, since scheduled runs can start late.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A full refresh is idempotent, so retrying a sync that did land is harmless. The first request
      # also waits for a cold start and Neon resuming.
      - name: POST /sync
        env:
          RADAR_URL: ${{ vars.RADAR_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 900 -X POST "$RADAR_URL/sync" \
            -H "Authorization: Bearer $SYNC_SECRET"

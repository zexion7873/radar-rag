name: LLM eval

# Paid: every run calls /ask on Opus 5.5 and a Sonnet 5 judge for each golden item. It runs only when
# asked: the eval:llm label on a PR, or a manual dispatch. Never switch this to pull_request_target.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-llm:
    # The key is a repository secret: on GitHub Free, environment secrets need a public repo.
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'eval:llm')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Both the service and the harness read these; without the secrets the run stays keyless.
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: https://jp.cloud.langfuse.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: evals
      - uses: actions/cache@v6
        with:
          path: ~/.djl.ai
          key: djl-${{ hashFiles('pom.xml') }}
      - uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}
      - run: scripts/fetch-models.sh
      - run: mvn -B -q package -DskipTests
      - name: Start the service with Notion pointed at the stub's port
        run: |
          NOTION_TOKEN=dummy NOTION_BASE_URL=http://127.0.0.1:8765 \
            nohup java -jar target/radar-rag-0.0.1-SNAPSHOT.jar > service.log 2>&1 &
          curl -s --retry 90 --retry-connrefused --retry-delay 2 -o /dev/null http://localhost:8080/
      - name: LLM eval over golden_v1, gated on code checks and metric floors
        working-directory: evals
        env:
          EVAL_SERVICE_URL: http://localhost:8080
          EVAL_NOTION_STUB_PORT: "8765"
        run: |
          uv sync --locked
          uv run radar-evals-llm --golden golden_v1.jsonl --fixture fixtures/trending.json \
            --out results/llm-latest.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-eval
          path: evals/results/llm-latest.json
          if-no-files-found: ignore
      - if: failure()
        run: tail -n 200 service.log

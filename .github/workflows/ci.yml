name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its running checks; a run already in progress on main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B verify

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: evals
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  eval-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same tag as docker-compose.yml, so CI searches on the local pgvector version.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: evals
      # The gate runs the image that ships. Layers, including the ~480 MB model, come from the GHA cache.
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: radar-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Host networking: the image reaches the Postgres service and the harness's Notion stub on localhost.
      # Cloud Run's 2 GiB with no swap, so a boot that outgrows it fails here first.
      - name: Start the image with Notion pointed at the stub's port
        run: |
          # The JDK client's own log, for the occasional sync whose request never reaches the stub
          # ("header parser received no bytes"); JAVA_TOOL_OPTIONS leaves the image's JAVA_FLAGS, which
          # the AOT cache was trained with, untouched.
          docker run -d --name radar --network host --memory=2g --memory-swap=2g \
            -e NOTION_TOKEN=dummy -e NOTION_BASE_URL=http://127.0.0.1:8765 \
            -e JAVA_TOOL_OPTIONS=-Djdk.httpclient.HttpClient.log=errors,requests,headers radar-rag:ci
          curl -s --retry 90 --retry-connrefused --retry-delay 2 -o /dev/null http://localhost:8080/
          docker logs radar 2>&1 | grep -E "Picked up JAVA_TOOL_OPTIONS|Started RadarIntelligenceApplication"
      - name: Sync from the frozen fixture and query the live service
        working-directory: evals
        env:
          EVAL_SERVICE_URL: http://localhost:8080
          EVAL_NOTION_STUB_PORT: "8765"
        run: |
          uv sync --locked
          uv run pytest -m service
      # Baselines come from this x86 runner, never a dev machine. With none committed the step writes
      # one for upload and still fails, so a deleted baseline cannot silently turn the gate off.
      - name: Retrieval eval over golden_v1, gated on hit@5 flips against the baseline
        working-directory: evals
        env:
          EVAL_SERVICE_URL: http://localhost:8080
          EVAL_NOTION_STUB_PORT: "8765"
        run: |
          # golden_v1 labels trending rows only, so it queries that source: the blog rows the stub also
          # serves cannot move a trending rank, and its baseline stays stamped by trending.json alone.
          args=(--golden golden_v1.jsonl --fixture fixtures/trending.json
                --fixture fixtures/blog.json --source trending
                --model-id paraphrase-multilingual-MiniLM-L12-v2
                --out results/latest.json --baseline results/baseline.json)
          if [ -f results/baseline.json ]; then
            uv run radar-evals "${args[@]}"
          else
            uv run radar-evals "${args[@]}" --write-baseline
            echo "::error::No results/baseline.json committed; commit the one in the retrieval-eval artifact."
            exit 1
          fi
      - name: Retrieval eval over golden_v2, gated on hit@5 flips against its baseline
        working-directory: evals
        env:
          EVAL_SERVICE_URL: http://localhost:8080
          EVAL_NOTION_STUB_PORT: "8765"
        run: |
          # golden_v2 labels trending and blog rows and queries every source, so both fixtures stamp it.
          args=(--golden golden_v2.jsonl --fixture fixtures/trending.json --fixture fixtures/blog.json
                --model-id paraphrase-multilingual-MiniLM-L12-v2
                --out results/latest_v2.json --baseline results/baseline_v2.json)
          if [ -f results/baseline_v2.json ]; then
            uv run radar-evals "${args[@]}"
          else
            uv run radar-evals "${args[@]}" --write-baseline
            echo "::error::No results/baseline_v2.json committed; commit the one in the retrieval-eval artifact."
            exit 1
          fi
      - name: Retrieval eval over golden_v1 on every source, gated on hit@5 flips against its baseline
        working-directory: evals
        env:
          EVAL_SERVICE_URL: http://localhost:8080
          EVAL_NOTION_STUB_PORT: "8765"
        run: |
          # /ask searches every source in turns; the trending-only step above cannot see blog rows
          # crowding its labels out. Blog rows count as misses here, so the score is a lower bound.
          args=(--golden golden_v1.jsonl --fixture fixtures/trending.json --fixture fixtures/blog.json
                --model-id paraphrase-multilingual-MiniLM-L12-v2
                --out results/latest_v1_all.json --baseline results/baseline_v1_all.json)
          if [ -f results/baseline_v1_all.json ]; then
            uv run radar-evals "${args[@]}"
          else
            uv run radar-evals "${args[@]}" --write-baseline
            echo "::error::No results/baseline_v1_all.json committed; commit the one in the retrieval-eval artifact."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-eval
          path: evals/results/
          if-no-files-found: ignore
      - if: failure()
        run: docker logs radar 2>&1 | tail -n 600

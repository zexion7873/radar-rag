name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its running checks; a run already in progress on main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: evals
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  eval-retrieval:
    name: eval-retrieval (${{ matrix.arm.name }})
    # M4's A/B: every arm scores the same golden set and fixture on this runner. Only the shipped
    # arm is gated against the baseline; the others only report.
    strategy:
      fail-fast: false
      matrix:
        arm:
          - { name: minilm, profile: "", model: all-MiniLM-L6-v2, gate: true }
          - { name: paraphrase, profile: paraphrase, model: paraphrase-multilingual-MiniLM-L12-v2, gate: false }
          - { name: e5, profile: e5, model: multilingual-e5-small, gate: false }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same tag as docker-compose.yml, so CI searches on the local pgvector version.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: evals
      # The pinned ONNX model (application.yml) and DJL's PyTorch natives download on first use.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.djl.ai
            /tmp/spring-ai-onnx-generative
          key: onnx-djl-${{ hashFiles('pom.xml', 'src/main/resources/application.yml') }}
      - if: matrix.arm.profile != ''
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ matrix.arm.profile }}-${{ hashFiles('scripts/fetch-models.sh') }}
      - if: matrix.arm.profile != ''
        run: scripts/fetch-models.sh ${{ matrix.arm.profile }}
      - run: mvn -B -q package -DskipTests
      - name: Start the service with Notion pointed at the stub's port
        run: |
          NOTION_TOKEN=dummy NOTION_BASE_URL=http://127.0.0.1:8765 SPRING_PROFILES_ACTIVE=${{ matrix.arm.profile }} \
            nohup java -jar target/radar-rag-0.0.1-SNAPSHOT.jar > service.log 2>&1 &
          curl -s --retry 90 --retry-connrefused --retry-delay 2 -o /dev/null http://localhost:8080/
      - name: Sync from the frozen fixture and query the live service
        working-directory: evals
        env:
          EVAL_SERVICE_URL: http://localhost:8080
          EVAL_NOTION_STUB_PORT: "8765"
        run: |
          uv sync --locked
          uv run pytest -m service
      # Baselines come from this x86 runner, never a dev machine. With none committed the step writes
      # one for upload and still fails, so a deleted baseline cannot silently turn the gate off.
      - name: Retrieval eval over golden_v1, gated on hit@5 flips against the baseline
        working-directory: evals
        env:
          EVAL_SERVICE_URL: http://localhost:8080
          EVAL_NOTION_STUB_PORT: "8765"
        run: |
          args=(--golden golden_v1.jsonl --fixture fixtures/trending.json --model-id ${{ matrix.arm.model }}
                --out results/latest.json)
          if [ "${{ matrix.arm.gate }}" != true ]; then
            uv run radar-evals "${args[@]}"
            exit 0
          fi
          args+=(--baseline results/baseline.json)
          if [ -f results/baseline.json ]; then
            uv run radar-evals "${args[@]}"
          else
            uv run radar-evals "${args[@]}" --write-baseline
            echo "::error::No results/baseline.json committed; commit the one in the retrieval-eval artifact."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-eval-${{ matrix.arm.name }}
          path: evals/results/
          if-no-files-found: ignore
      - if: failure()
        run: tail -n 200 service.log
